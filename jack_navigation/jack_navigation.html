const langNames={game:0,dev:1,privacy:2,email:3,radio:4,tools:5,community:6};
let current="zh",active="all";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 const t=T[current],rtl=current==="ar";document.documentElement.lang=({zh:"zh-CN",en:"en",ru:"ru",es:"es",ar:"ar",fr:"fr"})[current];document.documentElement.dir=rtl?"rtl":"ltr";
 document.getElementById("heading").textContent=t.heading;document.getElementById("subtitle").textContent=t.sub;document.getElementById("search").placeholder=t.search;document.getElementById("empty").textContent=t.empty;document.getElementById("notice").textContent=t.notice;document.getElementById("footer").textContent=t.footer;
 const filters=document.getElementById("filters");filters.innerHTML=`<button class="filter ${active==="all"?"active":""}" data-cat="all">${t.all}</button>`+t.cats.map((c,i)=>`<button class="filter ${active===Object.keys(langNames)[i]?"active":""}" data-cat="${Object.keys(langNames)[i]}">${esc(c)}</button>`).join("");
 filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;render();});
 const q=document.getElementById("search").value.trim().toLowerCase();
 const items=raw.filter(r=>(active==="all"||r[0]===active)&&(!q||r.slice(1).join(" ").toLowerCase().includes(q)));
 const groups={};items.forEach(r=>(groups[r[0]]??=[]).push(r));
 const content=document.getElementById("content");content.innerHTML="";
 Object.entries(groups).forEach(([cat,arr])=>{let idx=Object.keys(langNames).indexOf(cat);let section=document.createElement("section");section.className="section";section.innerHTML=`<div class="section-head"><h2>${esc(t.cats[idx])}</h2><span class="count">${arr.length}</span></div><div class="grid">${arr.map(r=>{let title=r[1],desc=r[2+({zh:0,en:1,ru:2,es:3,ar:4,fr:5}[current])];let host=new URL(r[2]).hostname.replace(/^www\./,"");return `<article class="item"><div class="item-top"><div class="symbol">${esc(title.slice(0,2).toUpperCase())}</div><h3>${esc(title)}</h3></div><p>${esc(desc)}</p><a href="${esc(r[2])}" target="_blank" rel="noopener noreferrer">${esc(t.visit)} · ${esc(host)}</a></article>`}).join("")}</div>`;content.appendChild(section);});
 document.getElementById("empty").style.display=items.length?"none":"block";
}
document.getElementById("language").addEventListener("change",e=>{current=e.target.value;active="all";render();});
document.getElementById("search").addEventListener("input",()=>render());
render();
</script>
